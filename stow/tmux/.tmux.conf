# Dark, high-contrast tmux layer with vi-style copy mode.
# Start with: tmux new-session -A -s main

set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g escape-time 10
set -g renumber-windows on

setw -g mode-keys vi

set -g status on
set -g status-position top
set -g status-style "bg=#111111,fg=#e6e6e6"
set -g status-left-length 30
set -g status-left-style "fg=#ffffff,bg=#005577,bold"
set -g status-left " #S "
set -g status-right-style "fg=#eeeeee,bg=#111111"
set -g status-right " %Y-%m-%d %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=#ffffff,bg=#770000,bold"
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#00a2ff"
set -g message-style "fg=#ffffff,bg=#770000,bold"
set -g mode-style "fg=#111111,bg=#ffd75f,bold"

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"
bind v copy-mode
bind / copy-mode \; send-keys /
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/clipboard-copy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$HOME/.local/bin/clipboard-copy"
bind-key -T copy-mode-vi Escape send-keys -X cancel
